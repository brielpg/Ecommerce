spring.application.name=ecommerce
server.port=8080

# Datasource
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Redis
api.redis.timeout=${REDIS_TIMEOUT}
spring.data.redis.port=6379
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.password=${REDIS_PASSWORD}
spring.cache.type=redis

# Token
api.security.token.secret=${JWT_SECRET}
api.security.token.issuer=${TOKEN_ISSUER}
api.security.token.expiration-hours=${TOKEN_EXPIRATION_HOURS}
api.security.token.timezone=${TIMEZONE}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
email.queue.name=${EMAIL_QUEUE_NAME}

# Infra
infra.front.endpoints=${FRONT_ENDPOINTS}

