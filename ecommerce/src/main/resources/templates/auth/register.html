<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Ecommerce</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #eee;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .form-label {
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
        }
        .form-control {
            border-radius: 8px;
            padding: 10px 15px;
            border: 1px solid #dce1e7;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25 margin-left: rgba(13, 110, 253, 0.1);
        }
        .section-title {
            border-left: 4px solid #0d6efd;
            padding-left: 10px;
            margin: 25px 0 15px 0;
            color: #333;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .btn-register {
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div style="margin-top:3vh;" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header text-center">
                    <h3 class="mb-0">Criar Nova Conta</h3>
                    <p class="text-muted small">Preencha os dados abaixo para começar</p>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/register}" method="post">

                        <div class="section-title">
                            <i class="fa-solid fa-user me-2"></i>Informações Pessoais
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label">Nome Completo</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="email@exemplo.com" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">Telefone</label>
                                <input type="text" class="form-control" id="phone" name="phone" placeholder="(00) 00000-0000" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="birthDate" class="form-label">Data de Nascimento</label>
                                <input type="date" class="form-control" id="birthDate" name="birthDate" required>
                            </div>
                        </div>

                        <div class="section-title">
                            <i class="fa-solid fa-location-dot me-2"></i>Endereço de Entrega
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="zipCode" class="form-label">CEP</label>
                                <input type="text" class="form-control" id="zipCode" name="zipCode" placeholder="00000-000" required>
                            </div>
                            <div class="col-md-8 mb-3">
                                <label for="streetName" class="form-label">Rua</label>
                                <input type="text" class="form-control" id="streetName" name="streetName" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="number" class="form-label">Número</label>
                                <input type="text" class="form-control" id="number" name="number" required>
                            </div>
                            <div class="col-md-5 mb-3">
                                <label for="complement" class="form-label">Complemento</label>
                                <input type="text" class="form-control" id="complement" name="complement">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="neighborhood" class="form-label">Bairro</label>
                                <input type="text" class="form-control" id="neighborhood" name="neighborhood" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="city" class="form-label">Cidade</label>
                                <input type="text" class="form-control" id="city" name="city" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="state" class="form-label">Estado</label>
                                <input type="text" class="form-control" id="state" name="state" required>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-register">
                                Finalizar Cadastro <i class="fa-solid fa-arrow-right ms-2"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="text-center mt-4">
                <p class="text-muted">Já tem uma conta? <a th:href="@{/login}" class="text-decoration-none">Faça login</a></p>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/javascript/script.js}"></script>
</body>
</html>
