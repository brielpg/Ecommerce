<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Ecommerce</a>
        <div class="navbar-nav ms-auto">
            <div sec:authorize="!isAuthenticated()">
                <a class="nav-link" href="/login">Login</a>
            </div>
            <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                <a class="nav-link" href="/categories">Categorias</a>
                <a class="nav-link" href="/admin" sec:authorize="hasRole('ADMIN')">Administração</a>

                <div class="dropdown">
                    <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="profileDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa-solid fa-circle-user fs-5"></i>
                        <span class="ms-2">Olá, <span sec:authentication="principal.username"></span></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
                        <li>
                            <a class="dropdown-item d-flex align-items-center" href="/profile">
                                <i class="fa-solid fa-user me-2"></i> Meu Perfil
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item d-flex align-items-center" href="/cart">
                                <i class="fa-solid fa-cart-shopping me-2"></i> Carrinho
                            </a>
                        </li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item d-flex align-items-center">
                                    <i class="fa-solid fa-right-from-bracket me-2"></i> Sair
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
