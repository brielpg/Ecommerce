<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/">Ecommerce</a>

        <form class="d-flex mx-auto col-12 col-lg-5 my-2 my-lg-0" th:action="@{/products/search}" method="get">
            <div class="input-group">
                <input class="form-control border-0 shadow-none" type="search" name="q"
                       placeholder="Buscar produtos..." aria-label="Search" th:value="${query}">
                <button class="btn btn-primary" type="submit">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </form>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="navbar-nav ms-auto">
            <div class="d-flex align-items-center">
                <a class="nav-link d-flex align-items-center" href="/favorites">
                    <i class="fa-solid fa-heart me-2"></i> Favoritos
                </a>

                <div class="dropdown">
                    <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="profileDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa-solid fa-circle-user fs-5"></i>
                        <span class="ms-2">Minha Conta</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
                        <li sec:authorize="!isAuthenticated()">
                            <a class="dropdown-item d-flex align-items-center" href="/login">
                                <i class="fa-solid fa-user-lock me-2"></i> Login
                            </a>
                        </li>
                        <li sec:authorize="!isAuthenticated()">
                            <a class="dropdown-item d-flex align-items-center" href="/register">
                                <i class="fa-solid fa-user-plus me-2"></i> Criar Conta
                            </a>
                        </li>
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item d-flex align-items-center" href="/admin">
                                <i class="fa-solid fa-cogs me-2"></i> Administração
                            </a>
                        </li>
                        <li sec:authorize="isAuthenticated()">
                            <a class="dropdown-item d-flex align-items-center" href="/profile">
                                <i class="fa-solid fa-user me-2"></i> Meu Perfil
                            </a>
                        </li>
                        <li sec:authorize="isAuthenticated()">
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item d-flex align-items-center">
                                    <i class="fa-solid fa-right-from-bracket me-2"></i> Sair
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>

                <a class="nav-link d-flex align-items-center" href="/cart">
                    <i class="fa-solid fa-cart-shopping me-2"></i> Carrinho
                </a>
            </div>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
