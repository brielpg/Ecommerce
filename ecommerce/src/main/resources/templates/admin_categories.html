<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Categorias | Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --sidebar-width: 260px; }
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }

        .main-content {
            margin-left: var(--sidebar-width);
            padding-top: 70px;
            min-height: 100vh;
            transition: all 0.3s;
        }

        .admin-card { border: none; border-radius: 12px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .table thead th { background-color: #f8f9fa; border-top: none; text-transform: uppercase; font-size: 0.75rem; color: #6c757d; padding: 15px; }

        .status-badge { padding: 0.4em 0.8em; border-radius: 50rem; font-size: 0.85rem; font-weight: 600; }
        .bg-light-success { background-color: #d1e7dd; color: #0f5132; }
        .bg-light-danger { background-color: #f8d7da; color: #842029; }

        @media (max-width: 992px) { .main-content { margin-left: 0; } }
    </style>
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: sidebar}"></div>

<main class="main-content">
    <div class="container-fluid p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark mb-1">Categorias</h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/admin" class="text-decoration-none">Dashboard</a></li>
                        <li class="breadcrumb-item active">Categorias</li>
                    </ol>
                </nav>
            </div>
            <button class="btn btn-primary px-4 shadow-sm fw-bold" data-bs-toggle="modal" data-bs-target="#createCategoryModal">
                <i class="fas fa-plus me-2"></i>Nova Categoria
            </button>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm" role="alert">
            <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card admin-card mb-4">
            <div class="card-body p-3">
                <form method="get" th:action="@{/admin/categories}" class="row g-2">
                    <div class="col-md-10">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-filter"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" name="search" th:value="${param.search}" placeholder="Filtrar categorias por nome, descrição...">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-dark w-100">Buscar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card admin-card overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Nome da Categoria</th>
                        <th>Descrição</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="category : ${categories.content}">
                        <td class="ps-4">
                            <div class="fw-bold text-dark" th:text="${category.name}">Eletrônicos</div>
                            <div class="text-muted small" th:text="${'ID: ' + #strings.abbreviate(category.id, 8)}">ID</div>
                        </td>
                        <td class="text-muted" th:text="${#strings.abbreviate(category.description, 50)}">Descrição curta...</td>
                        <td>
                            <span th:if="${category.active}" class="status-badge bg-light-success">Ativo</span>
                            <span th:unless="${category.active}" class="status-badge bg-light-danger">Inativo</span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="btn-group shadow-sm">
                                <button class="btn btn-white btn-sm border" title="Editar"
                                        onclick="editCategory(this)"
                                        th:data-id="${category.id}"
                                        th:data-name="${category.name}"
                                        th:data-description="${category.description}">
                                    <i class="fas fa-edit text-primary"></i>
                                </button>

                                <button th:if="${category.active}" class="btn btn-white btn-sm border text-danger"
                                        onclick="deleteCategory(this)" th:data-id="${category.id}" th:data-name="${category.name}">
                                    <i class="fas fa-trash"></i>
                                </button>

                                <button th:unless="${category.active}" class="btn btn-white btn-sm border text-success"
                                        onclick="restoreCategory(this)" th:data-id="${category.id}" th:data-name="${category.name}">
                                    <i class="fas fa-undo"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="card-footer bg-white py-3 border-0">
                <nav th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/categories(page=${currentPage - 1})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/admin/categories(page=${i})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/categories(page=${currentPage + 1})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="createCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-dark text-white border-0">
                <h5 class="modal-title fw-bold" id="createCategoryModalLabel">Nova Categoria</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="categoryForm">
                <div class="modal-body p-4">
                    <input type="hidden" id="categoryId" name="id">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nome da Categoria</label>
                        <input type="text" class="form-control form-control-lg" id="categoryName" name="name" required>
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-bold">Descrição</label>
                        <textarea class="form-control" id="categoryDescription" name="description" rows="4" required></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-5 fw-bold" id="saveCategoryBtn">Salvar Categoria</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/javascript/script.js}"></script>
</body>
</html>
