<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin - Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background-color: rgb(250, 250, 250); display: flex; flex-direction: column; min-height: 100vh; margin: 0;">
    <nav th:replace="~{navbar :: navbar}"></nav>

    <!-- Sidebar -->
    <div th:replace="~{admin_sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <div style="flex-grow: 1; margin-left: 250px; padding-top: 80px;">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <!-- Success/Error Messages -->
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Header -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h1><i class="fa-solid fa-tags me-2"></i>Gerenciar Categorias</h1>
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createCategoryModal">
                            <i class="fa-solid fa-plus me-2"></i>Nova Categoria
                        </button>
                    </div>

                    <!-- Categories Table -->
                    <div class="card">
                        <div class="card-header">
                            <h5>Lista de Categorias</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Nome</th>
                                            <th>Descrição</th>
                                            <th>Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="category : ${categories.content}">
                                            <td th:text="${category.id}"></td>
                                            <td th:text="${category.name}"></td>
                                            <td th:text="${category.description}"></td>
                                            <td>
                                                <button class="btn btn-sm btn-warning me-2" onclick="editCategory(this)" th:data-id="${category.id}" th:data-name="${category.name}" th:data-description="${category.description}">
                                                    <i class="fa-solid fa-edit"></i> Editar
                                                </button>
                                                <button class="btn btn-sm btn-danger" onclick="deleteCategory(this)" th:data-id="${category.id}" th:data-name="${category.name}">
                                                    <i class="fa-solid fa-trash"></i> Excluir
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- Pagination -->
                            <nav aria-label="Categories pagination" th:if="${totalPages > 1}">
                                <ul class="pagination justify-content-center">
                                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                        <a class="page-link" th:href="@{/admin/categories(page=${currentPage - 1}, size=10)}" aria-label="Previous">
                                            <span aria-hidden="true">&laquo;</span>
                                        </a>
                                    </li>
                                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                                        <a class="page-link" th:href="@{/admin/categories(page=${i}, size=10)}" th:text="${i + 1}"></a>
                                    </li>
                                    <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                                        <a class="page-link" th:href="@{/admin/categories(page=${currentPage + 1}, size=10)}" aria-label="Next">
                                            <span aria-hidden="true">&raquo;</span>
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create/Edit Category Modal -->
    <div class="modal fade" id="createCategoryModal" tabindex="-1" aria-labelledby="createCategoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createCategoryModalLabel">Criar Nova Categoria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="categoryForm" method="post" th:action="'/admin/categories'" th:object="${categoryDto}">
                    <div class="modal-body">
                        <input type="hidden" id="categoryId" name="id">
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">Nome da Categoria</label>
                            <input type="text" class="form-control" id="categoryName" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="categoryDescription" class="form-label">Descrição</label>
                            <textarea class="form-control" id="categoryDescription" name="description" rows="3" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="saveCategoryBtn">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function editCategory(button) {
            const id = button.getAttribute('data-id');
            const name = button.getAttribute('data-name');
            const description = button.getAttribute('data-description');

            document.getElementById('categoryId').value = id;
            document.getElementById('categoryName').value = name;
            document.getElementById('categoryDescription').value = description;

            document.getElementById('saveCategoryBtn').innerHTML = 'Atualizar';
            document.getElementById('createCategoryModalLabel').innerHTML = 'Editar Categoria';

            const modal = new bootstrap.Modal(document.getElementById('createCategoryModal'));
            modal.show();
        }

        function deleteCategory(button) {
            const id = button.getAttribute('data-id');
            const name = button.getAttribute('data-name');

            if (confirm(`Tem certeza que deseja excluir a categoria "${name}"?`)) {
                fetch(`/api/categories/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        alert('Erro ao excluir categoria');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Erro ao excluir categoria');
                });
            }
        }

        document.getElementById('createCategoryModal').addEventListener('hidden.bs.modal', function () {
            // Limpa os valores
            document.getElementById('categoryId').value = '';
            document.getElementById('categoryName').value = '';
            document.getElementById('categoryDescription').value = '';

            // Restaura o visual para Criação
            document.getElementById('saveCategoryBtn').innerHTML = 'Salvar';
            document.getElementById('createCategoryModalLabel').innerHTML = 'Criar Nova Categoria';
        });
    </script>
</body>
<footer th:replace="~{footer :: footer}"></footer>
</html>
