<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<body>

<!-- Default Product Card-->
<div th:fragment="product-card(product)" class="card product-card h-100 border-0 shadow-sm position-relative">
    <form th:action="@{/favorites/{productId}(productId=${product.id})}" method="post" sec:authorize="isAuthenticated()">
        <button type="submit" class="favorite-btn">
            <i th:class="${favoriteIds != null && favoriteIds.contains(product.id)} ? 'fas fa-heart' : 'fa-regular fa-heart'"></i>
        </button>
    </form>
    <div class="img-container">
        <img src="https://via.placeholder.com/400x400" th:alt="${product.name}" class="card-img-top">
    </div>
    <div class="card-body d-flex flex-column p-4">
        <h5 class="card-title fw-bold mb-1 text-truncate" th:text="${product.name}">Nome</h5>
        <p class="text-muted small text-truncate-2 mb-3" th:text="${product.description}">Descrição</p>
        <div class="mt-auto">
            <div class="fw-bold text-dark mb-3 d-flex align-items-center gap-1">
                <h4 class="mb-0">R$</h4>
                <h4 class="mb-0" th:text="${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')}">0,00</h4>
            </div>
            <div class="d-flex gap-2">
                <form th:action="@{/cart/add}" method="post" class="flex-grow-1">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <button type="submit" class="btn btn-outline-primary w-100 py-2">
                        <i class="fas fa-cart-plus me-2"></i>ADICIONAR
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- BestSellers Product Card-->
<div th:fragment="best-seller-card(product)" class="card product-card h-100 border-0 shadow-sm position-relative" style="border: 2px solid #ffc107 !important;">
    <span class="badge bg-danger position-absolute top-0 start-0 m-3 z-index-2 px-3 py-2">
        <i class="fas fa-star me-1"></i> POPULAR
    </span>

    <div class="img-container">
        <img src="https://via.placeholder.com/400x400" th:alt="${product.name}">
    </div>

    <div class="card-body d-flex flex-column p-4">
        <h5 class="card-title fw-bold mb-1" th:text="${product.name}">Nome</h5>

        <div class="fw-bold text-primary mb-3 d-flex align-items-center gap-1">
            <h4>R$</h4>
            <h4 th:text="${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')}">0,00</h4>
        </div>

        <div class="mt-auto">
            <form th:action="@{/cart/add}" method="post">
                <input type="hidden" name="productId" th:value="${product.id}">
                <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm">
                    <i class="fas fa-cart-plus me-2"></i>ADICIONAR
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
