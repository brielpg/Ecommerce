<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Carrinho - Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav th:replace="~{navbar :: navbar}"></nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <h1>Seu Carrinho</h1>
                <div th:if="${#lists.isEmpty(cart.items)}">
                    <p>Seu carrinho está vazio.</p>
                </div>
                <div th:if="${!#lists.isEmpty(cart.items)}">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Quantidade</th>
                                <th>Preço Unitário</th>
                                <th>Subtotal</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cart.items}">
                                <td th:text="${item.product.name}">Nome do Produto</td>
                                <td th:text="${item.quantity}">1</td>
                                <td>R$ <span th:text="${#numbers.formatDecimal(item.product.price, 1, 2)}">0.00</span></td>
                                <td>R$ <span th:text="${#numbers.formatDecimal(item.subTotal, 1, 2)}">0.00</span></td>
                                <td>
                                    <form th:action="@{/cart/remove}" method="post" class="d-inline">
                                        <input type="hidden" name="productId" th:value="${item.product.id}">
                                        <input type="number" name="quantity" min="1" th:max="${item.quantity}" class="form-control d-inline" style="width: 80px;" placeholder="Qtd">
                                        <button type="submit" class="btn btn-danger btn-sm">Remover</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="text-end">
                        <h4>Total: R$ <span th:text="${#numbers.formatDecimal(cart.totalPrice, 1, 2)}">0.00</span></h4>
                        <form th:action="@{/cart/clear}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-warning">Limpar Carrinho</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
<footer th:replace="~{footer :: footer}"></footer>
</html>
