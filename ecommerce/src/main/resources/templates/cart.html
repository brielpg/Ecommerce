<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Carrinho - Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{navbar :: navbar}"></nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <h1>Seu Carrinho</h1>
                <div th:if="${#lists.isEmpty(cart.items)}">
                    <p>Seu carrinho está vazio.</p>
                </div>
                <div th:if="${!#lists.isEmpty(cart.items)}">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Quantidade</th>
                                <th>Preço Unitário</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cart.items}">
                                <td th:text="${item.product.name}">Nome do Produto</td>
                                <td th:text="${item.quantity}">1</td>
                                <td>R$ <span th:text="${#numbers.formatDecimal(item.product.price, 1, 2)}">0.00</span></td>
                                <td>R$ <span th:text="${#numbers.formatDecimal(item.subTotal, 1, 2)}">0.00</span></td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="text-end">
                        <h4>Total: R$ <span th:text="${#numbers.formatDecimal(cart.totalPrice, 1, 2)}">0.00</span></h4>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
