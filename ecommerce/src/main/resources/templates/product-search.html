<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Busca - Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; padding-top: 80px; }
        .product-card { border: none; border-radius: 15px; transition: 0.3s; background: #fff; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .img-container { height: 220px; overflow: hidden; background: #fdfdfd; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<div class="container mb-5">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h2 class="fw-bold">Resultado da busca</h2>
            <p class="text-muted" th:if="${query != null && !query.isEmpty()}">
                Mostrando resultados para: <strong class="text-primary" th:text="${query}"></strong>
            </p>
        </div>
        <div class="col-auto">
            <span class="badge bg-dark px-3 py-2" th:text="${products.totalElements + ' produtos encontrados'}"></span>
        </div>
    </div>

    <div th:if="${products.empty}" class="text-center py-5">
        <i class="fas fa-search mb-3 text-muted" style="font-size: 3rem;"></i>
        <h3>Nenhum produto encontrado</h3>
        <p class="text-muted">Tente usar palavras-chave mais genéricas.</p>
        <a href="/" class="btn btn-primary mt-3">Voltar para Home</a>
    </div>

    <div class="row g-4">
        <div class="col-sm-6 col-lg-4 col-xl-3" th:each="product : ${products.content}">
            <div class="card product-card h-100">
                <div class="img-container">
                    <img src="https://via.placeholder.com/400x400" th:alt="${product.name}">
                </div>
                <div class="card-body d-flex flex-column p-4">
                    <h5 class="card-title fw-bold mb-1" th:text="${product.name}"></h5>
                    <p class="text-muted small text-truncate" th:text="${product.description}"></p>

                    <div class="mt-auto">
                        <div class="fw-bold text-primary mb-3">
                            <h4 th:text="'R$ ' + ${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')}"></h4>
                        </div>
                        <form th:action="@{/cart/add}" method="post">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <button type="submit" class="btn btn-outline-primary w-100">
                                <i class="fas fa-cart-plus me-2"></i>ADICIONAR
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${products.totalPages > 1}" class="mt-5">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link" th:href="@{/products/search(q=${query}, page=${products.number - 1})}">Anterior</a>
            </li>
            <li class="page-item disabled"><span class="page-link" th:text="${products.number + 1}"></span></li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link" th:href="@{/products/search(q=${query}, page=${products.number + 1})}">Próximo</a>
            </li>
        </ul>
    </nav>
</div>

<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
