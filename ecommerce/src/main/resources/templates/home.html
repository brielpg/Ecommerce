<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - Ecommerce</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            margin-bottom: 50px;
            border-radius: 0 0 20px 20px;
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<header class="hero-section mt-5">
    <div class="container">
        <h1 class="display-3 fw-bold">Ofertas de Verão</h1>
        <p class="lead mb-4">Descubra as melhores tendências com preços que você só encontra aqui.</p>
        <a href="#todos-produtos" class="btn btn-primary btn-lg px-5">Explorar Agora</a>
    </div>
</header>

<div class="container mb-5">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <section class="mb-5 text-center">
        <h3 class="fw-bold mb-4">Explore por Categoria</h3>
        <div class="d-flex flex-wrap justify-content-center gap-3">
            <div th:each="category : ${categories.content}">
                <a th:href="@{/category/{id}(id=${category.id})}" class="category-pill">
                    <i class="fa-solid fa-tag me-2"></i>
                    <span th:text="${category.name}">Categoria</span>
                </a>
            </div>
        </div>
    </section>

    <div id="produtos" class="container mb-5">

        <section th:if="${!#lists.isEmpty(bestSellers)}" class="mb-5 pb-4" style="background: #fff8e1; border-radius: 20px; padding: 30px;">
            <div class="d-flex align-items-center mb-4">
                <div class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 45px; height: 45px;">
                    <i class="fas fa-fire fs-5"></i>
                </div>
                <div>
                    <h3 class="fw-bold m-0 text-dark">Best Sellers</h3>
                    <p class="text-muted mb-0 small text-uppercase fw-bold">Os favoritos da nossa comunidade</p>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-sm-6 col-lg-4 col-xl-3" th:each="product : ${bestSellers}">
                    <div th:replace="~{fragments :: best-seller-card(product=${product})}"></div>
                </div>
            </div>
        </section>

        <section id="todos-produtos" class="mt-5">
            <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-3">
                <div>
                    <h3 class="fw-bold m-0">Nossa Vitrine Completa</h3>
                    <p class="text-muted mb-0">Explore todos os nossos produtos selecionados</p>
                </div>
                <span class="badge bg-light text-dark border px-3 py-2" th:text="${products.totalElements + ' itens encontrados'}">0 itens</span>
            </div>

            <div class="row g-4">
                <div class="col-sm-6 col-lg-4 col-xl-3" th:each="product : ${products.content}">
                    <div th:replace="~{fragments :: product-card(product=${product})}"></div>
                </div>
            </div>
        </section>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/javascript/script.js}"></script>
</body>
</html>
