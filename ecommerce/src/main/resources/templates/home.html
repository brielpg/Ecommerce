<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Home - Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{navbar :: navbar}"></nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <h1>Bem-vindo ao Ecommerce</h1>
                <p>Esta é a página inicial da nossa aplicação de e-commerce.</p>

                <div sec:authorize="!isAuthenticated()">
                    <p>Para acessar mais funcionalidades, faça o login.</p>
                    <a href="/login" class="btn btn-primary">Fazer Login</a>
                </div>

                <div sec:authorize="isAuthenticated()">
                    <p>Você está logado e pode acessar as funcionalidades da API e das telas MVC.</p>
                    <div class="mt-4">
                        <h3>Links das Telas MVC:</h3>
                        <ul>
                            <li><a href="/products">Produtos</a></li>
                            <li><a href="/categories">Categorias</a></li>
                            <li><a href="/cart">Carrinho</a></li>
                            <li><a href="/profile">Perfil</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
