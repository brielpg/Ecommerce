<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${product.name} + ' - Ecommerce'"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; padding-top: 100px; }
    .product-img-container { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .price-large { font-size: 2.5rem; color: #0d6efd; font-weight: 800; }
    .badge-category { background: #e9ecef; color: #495057; padding: 8px 15px; border-radius: 50px; text-decoration: none; }
  </style>
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<div class="container mb-5">
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/">Home</a></li>
      <li class="breadcrumb-item active" th:text="${product.name}">Produto</li>
    </ol>
  </nav>

  <div class="row g-5">
    <div class="col-lg-6">
      <div class="product-img-container text-center">
        <img src="https://via.placeholder.com/600x600" class="img-fluid rounded" th:alt="${product.name}">
      </div>
    </div>

    <div class="col-lg-6">
      <div class="ps-lg-4">
        <h1 class="display-5 fw-bold mb-3" th:text="${product.name}">Nome do Produto</h1>

        <div class="d-flex align-items-center mb-4 gap-3">
          <a th:each="category : ${product.categories}" th:href="@{/categories/{id}(id=${category.id})}" class="badge-category">
            <i class="fas fa-tag me-2"></i> <span th:text="${category.name}">Nome da Categoria</span>
          </a>
          <span class="text-success fw-bold"><i class="fas fa-check-circle me-1"></i> Em estoque</span>
        </div>

        <hr class="my-4">

        <div class="mb-4">
          <p class="text-muted small mb-1">Preço à vista</p>
          <div class="price-large">
            <small>R$</small>
            <span th:text="${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')}">0,00</span>
          </div>
        </div>

        <div class="mb-5">
          <h5 class="fw-bold">Descrição</h5>
          <p class="lead text-muted" th:text="${product.description}">Descrição detalhada aqui.</p>
        </div>

        <div class="card p-4 border-0 shadow-sm bg-light">
          <form th:action="@{/cart/add}" method="post">
            <input type="hidden" name="productId" th:value="${product.id}">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label small fw-bold">Quantidade</label>
                <input type="number" name="quantity" value="1" min="1" class="form-control form-control-lg text-center">
              </div>
              <div class="col-md-8 d-flex align-items-end">
                <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold">
                  <i class="fas fa-shopping-cart me-2"></i>ADICIONAR AO CARRINHO
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
