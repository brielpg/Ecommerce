<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${categoryName} + ' - Ecommerce'"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .category-header {
            background: white;
            padding: 40px 0;
            margin-bottom: 40px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<header class="category-header">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-2">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Categorias</li>
            </ol>
        </nav>
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="fw-bold mb-0" th:text="${categoryName}">Nome da Categoria</h1>
                <p class="text-muted mb-0" th:text="${products.totalElements + ' produtos encontrados'}"></p>
            </div>
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    Ordenar por
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" th:href="@{/category/{id}(id=${categoryId}, price='asc')}">Menor Preço</a></li>
                    <li><a class="dropdown-item" th:href="@{/category/{id}(id=${categoryId}, price='desc')}">Maior Preço</a></li>
                </ul>
            </div>
        </div>
    </div>
</header>

<div class="container mb-5">
    <div th:if="${products.empty}" class="text-center py-5">
        <i class="fas fa-box-open mb-3 text-muted" style="font-size: 4rem;"></i>
        <h3>Nenhum produto nesta categoria</h3>
        <p class="text-muted">No momento não temos itens disponíveis para esta seleção.</p>
        <a href="/" class="btn btn-primary mt-3">Voltar para a Loja</a>
    </div>

    <div class="row g-4">
        <div class="col-sm-6 col-lg-4 col-xl-3" th:each="product : ${products.content}">
            <div th:replace="~{fragments :: product-card(product=${product}, showRemoveBtn=false)}"></div>
        </div>
    </div>

    <nav th:if="${products.totalPages > 1}" class="mt-5">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link" th:href="@{/products/category/{id}(id=${categoryId}, page=${products.number - 1})}">Anterior</a>
            </li>
            <li class="page-item active">
                <span class="page-link" th:text="${products.number + 1}">1</span>
            </li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link" th:href="@{/products/category/{id}(id=${categoryId}, page=${products.number + 1})}">Próximo</a>
            </li>
        </ul>
    </nav>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
