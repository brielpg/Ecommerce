<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Usuários | Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --sidebar-width: 260px; }
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }

        .main-content {
            margin-left: var(--sidebar-width);
            padding-top: 70px;
            min-height: 100vh;
            transition: all 0.3s;
        }

        .admin-card { border: none; border-radius: 12px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .user-avatar { width: 40px; height: 40px; background: #e9ecef; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #6c757d; }

        .status-badge { padding: 0.4em 0.8em; border-radius: 50rem; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .bg-light-success { background-color: #d1e7dd; color: #0f5132; }
        .bg-light-danger { background-color: #f8d7da; color: #842029; }

        @media (max-width: 992px) { .main-content { margin-left: 0; } }
    </style>
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1">Usuários</h2>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="/admin" class="text-decoration-none">Dashboard</a></li>
                            <li class="breadcrumb-item active">Clientes</li>
                        </ol>
                    </nav>
                </div>
            </div>

            <div class="card admin-card overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr class="bg-light">
                            <th class="ps-4">Cliente</th>
                            <th>Contato</th>
                            <th>Endereços</th>
                            <th>Status</th>
                            <th>Cadastro</th>
                            <th class="text-end pe-4">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users.content}">
                            <td class="ps-4">
                                <div class="d-flex align-items-center">
                                    <div class="user-avatar me-3" th:text="${#strings.substring(user.name, 0, 1)}">U</div>
                                    <div>
                                        <div class="fw-bold text-dark" th:text="${user.name}">Nome do Usuário</div>
                                        <div class="text-muted small" th:text="${user.email}">email@exemplo.com</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="small"><i class="fas fa-phone me-1 text-muted"></i> <span th:text="${user.phone}">Telefone</span></div>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${user.addresses.size() + ' Endereço(s)'}">0</span>
                            </td>
                            <td>
                                <span th:if="${user.active}" class="status-badge bg-light-success">Ativo</span>
                                <span th:unless="${user.active}" class="status-badge bg-light-danger">Inativo</span>
                            </td>
                            <td class="text-muted small" th:text="${#temporals.format(user.timestamp, 'dd/MM/yyyy')}">01/01/2024</td>
                            <td class="text-end pe-4">
                                <div class="btn-group">
                                    <button th:if="${user.active}" class="btn btn-outline-danger btn-sm"
                                            onclick="deleteUser(this)" th:data-id="${user.id}">
                                        <i class="fas fa-user-slash"></i>
                                    </button>

                                    <button th:unless="${user.active}" class="btn btn-outline-success btn-sm"
                                            onclick="restoreUser(this)" th:data-id="${user.id}">
                                        <i class="fas fa-user-check"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="card-footer bg-white py-3 border-0">
                    <nav th:if="${users.totalPages > 1}">
                        <ul class="pagination justify-content-center mb-0">
                            <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/users(page=${users.number - 1})}">Anterior</a>
                            </li>
                            <li class="page-item active"><span class="page-link" th:text="${users.number + 1}">1</span></li>
                            <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/users(page=${users.number + 1})}">Próximo</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/javascript/script.js}"></script>
</body>
</html>
