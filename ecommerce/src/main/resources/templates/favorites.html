<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Favoritos - Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }
        .page-header {
            margin-bottom: 40px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        .product-card {
            border: none;
            border-radius: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
        }
        .img-container {
            position: relative;
            overflow: hidden;
            background: #fdfdfd;
        }
        .card-img-top {
            height: 220px;
            object-fit: contain;
            padding: 15px;
            transition: transform 0.5s ease;
        }
        .product-card:hover .card-img-top {
            transform: scale(1.05);
        }
        .price-tag {
            font-size: 1.25rem;
            color: #2c3e50;
            margin: 10px 0;
        }
        .btn-cart {
            border-radius: 8px;
            font-weight: 600;
            padding: 10px;
            flex-grow: 1;
        }
        .btn-remove {
            border-radius: 8px;
            padding: 10px 15px;
            margin-left: 8px;
        }
        .empty-state {
            padding: 80px 0;
            text-align: center;
        }
        .empty-state i {
            font-size: 4rem;
            color: #dee2e6;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<div style="flex-grow: 1;">
    <div class="container mt-5" style="padding-top: 60px; padding-bottom: 50px;">
        <div class="page-header d-flex align-items-center">
            <i class="fas fa-heart text-danger me-3 fs-2"></i>
            <h1 class="fw-bold mb-0">Meus Favoritos</h1>
        </div>

        <div th:if="${#lists.isEmpty(favorites)}" class="empty-state">
            <i class="fas fa-heart-broken"></i>
            <h3 class="text-muted">Sua lista está vazia</h3>
            <p class="text-secondary">Que tal explorar nossos produtos e salvar seus favoritos?</p>
            <a th:href="@{/}" class="btn btn-primary mt-3 px-4 py-2">Explorar Loja</a>
        </div>

        <div th:if="${!#lists.isEmpty(favorites)}">
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
                <div class="col" th:each="product : ${favorites}">
                    <div class="card h-100 product-card">
                        <div class="img-container">
                            <img src="https://via.placeholder.com/300x300?text=Produto"
                                 class="card-img-top" th:alt="${product.name}">
                        </div>

                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title text-truncate" th:text="${product.name}" th:title="${product.name}">Nome do Produto</h5>
                            <p class="card-text text-muted small"
                               style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 40px;"
                               th:text="${product.description}">
                                Descrição curta.
                            </p>

                            <div class="price-tag fw-bold">
                                <span class="fs-6 fw-normal">R$</span>
                                <span th:text="${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')}">0.00</span>
                            </div>

                            <div class="d-flex mt-auto pt-3">
                                <form th:action="@{/cart/add}" method="post" class="d-flex flex-grow-1">
                                    <input type="hidden" th:name="productId" th:value="${product.id}">
                                    <input type="hidden" name="quantity" value="1">
                                    <button type="submit" class="btn btn-primary btn-cart">
                                        <i class="fas fa-shopping-cart me-2"></i>Comprar
                                    </button>
                                </form>

                                <form th:action="@{/favorites/{productId}(productId=${product.id})}" method="post">
                                    <button type="submit" class="btn btn-outline-danger btn-remove" title="Remover dos favoritos">
                                        <i class="fas fa-trash-can"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
