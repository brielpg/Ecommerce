<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Favoritos - Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background-color: rgb(250, 250, 250);">
    <nav th:replace="~{navbar :: navbar}"></nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <h1>Meus Favoritos</h1>
                <div th:if="${#lists.isEmpty(favorites)}">
                    <p>Você ainda não tem produtos favoritos.</p>
                </div>
                <div th:if="${!#lists.isEmpty(favorites)}">
                    <div class="row">
                        <div class="col-md-4 mb-4" th:each="product : ${favorites}">
                            <div class="card h-100">
                                <!-- Imagem do Produto (placeholder se não houver) -->
                                <img src="https://via.placeholder.com/300x200?text=Imagem+do+Produto" class="card-img-top" alt="Imagem do Produto">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title fw-bold" th:text="${product.name}">Nome do Produto</h5>
                                    <p class="card-text" th:text="${product.description}">Descrição do produto</p>
                                    <p class="card-text fw-bold">R$ <span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span></p>
                                    <div class="d-flex justify-content-between align-items-center mt-auto">
                                        <form th:action="@{/cart/add}" method="post" class="me-2">
                                            <input type="hidden" th:name="productId" th:value="${product.id}">
                                            <input type="hidden" name="quantity" value="1">
                                            <button type="submit" class="btn btn-primary">Adicionar ao Carrinho</button>
                                        </form>
                                        <form th:action="@{/favorites/{productId}(productId=${product.id})}" method="post">
                                            <button type="submit" class="btn btn-outline-danger">
                                                <i class="fas fa-heart"></i>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
<footer th:replace="~{footer :: footer}"></footer>
</html>
