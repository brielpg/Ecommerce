<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Ecommerce</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .login-container {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .card-header {
            background: #fff;
            border-bottom: none;
            padding-top: 40px;
            padding-bottom: 0;
        }
        .brand-icon {
            width: 60px;
            height: 60px;
            background: #0d6efd;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
        }
        .input-group-text {
            background-color: transparent;
            border-right: none;
            color: #adb5bd;
        }
        .form-control {
            border-left: none;
            padding: 12px;
            border-radius: 0 8px 8px 0;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #ced4da;
        }
        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: #0d6efd;
            color: #0d6efd;
        }
        .btn-login {
            background: #0d6efd;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: #0b5ed7;
            transform: translateY(-1px);
        }
        .forgot-password {
            font-size: 0.85rem;
            text-decoration: none;
            color: #6c757d;
        }
        .forgot-password:hover {
            color: #0d6efd;
        }
    </style>
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<div style="margin-top:3vh;" class="login-container container">
    <div class="row justify-content-center w-100 m-0">
        <div style="width: 65%;" class="col-md-18 col-lg-4">
            <div class="card p-4">
                <div class="card-header text-center">
                    <div class="brand-icon">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h3 class="fw-bold">Bem-vindo</h3>
                    <p class="text-muted">Acesse sua conta para continuar</p>
                </div>
                <div class="card-body">
                    <form th:action="@{/login}" method="post">
                        <div class="mb-4">
                            <label for="username" class="form-label small fw-bold text-uppercase">Usuário / Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu usuário" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="form-label small fw-bold text-uppercase">Senha</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="mb-4 form-check d-flex justify-content-between">
                            <div>
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label small text-muted" for="remember">Lembrar de mim</label>
                            </div>

                            <a href="#" class="forgot-password">Esqueceu a senha?</a>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-login">Entrar</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-transparent border-0 text-center pb-4">
                    <p class="text-muted small">Não tem uma conta? <a th:href="@{/register}" class="fw-bold text-decoration-none text-primary">Cadastre-se</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
