<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Favoritos - Ecommerce</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-header {
            margin-bottom: 40px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        .empty-state {
            padding: 80px 0;
            text-align: center;
        }
        .empty-state i {
            font-size: 4rem;
            color: #dee2e6;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div style="flex-grow: 1;">
    <div class="container mt-5" style="padding-top: 60px; padding-bottom: 50px;">
        <div class="page-header d-flex align-items-center">
            <i class="fas fa-heart text-danger me-3 fs-2"></i>
            <h1 class="fw-bold mb-0">Meus Favoritos</h1>
        </div>

        <div th:if="${#lists.isEmpty(favorites)}" class="empty-state">
            <i class="fas fa-heart-broken"></i>
            <h3 class="text-muted">Sua lista está vazia</h3>
            <p class="text-secondary">Que tal explorar nossos produtos e salvar seus favoritos?</p>
            <a th:href="@{/}" class="btn btn-primary mt-3 px-4 py-2">Explorar Loja</a>
        </div>

        <div th:if="${!#lists.isEmpty(favorites)}">
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
                <div class="col" th:each="product : ${favorites}">
                    <div th:replace="~{fragments :: product-card(product=${product})}"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/javascript/script.js}"></script>
</body>
</html>
