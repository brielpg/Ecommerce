<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title th:text="${product.name} + ' - Ecommerce'"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; padding-top: 100px; }
    .product-img-container { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .price-large { font-size: 2.5rem; color: #0d6efd; font-weight: 800; }
    .badge-category { background: #e9ecef; color: #495057; padding: 8px 15px; border-radius: 50px; text-decoration: none; }
  </style>
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container mb-5">
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
      <li class="breadcrumb-item active" th:text="${product.name}">Produto</li>
    </ol>
  </nav>

  <div class="row g-5">
    <div class="col-lg-6">
      <div class="product-img-container text-center">
        <img th:src="@{/api/products/{id}/image(id=${product.id})}" class="img-fluid rounded" th:alt="${product.name}">
      </div>
    </div>

    <div class="col-lg-6">
      <div class="ps-lg-4">
        <h1 class="display-5 fw-bold mb-3" th:text="${product.name}">Nome do Produto</h1>

        <div class="d-flex align-items-center mb-4 gap-3">
          <a th:each="category : ${categories}" th:href="@{/produtos/categoria/{id}(id=${category.id})}" class="badge-category">
            <i class="fas fa-tag me-2"></i> <span th:text="${category.name}">Nome da Categoria</span>
          </a>
          <span class="text-success fw-bold"><i class="fas fa-check-circle me-1"></i> Em estoque</span>
        </div>

        <hr class="my-4">

        <div class="mb-4">
          <p class="text-muted small mb-1">Preço à vista</p>
          <div class="price-large">
            <small>R$</small>
            <span th:text="${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')}">0,00</span>
          </div>
        </div>

        <div class="mb-5">
          <h5 class="fw-bold">Descrição</h5>
          <p class="lead text-muted" th:text="${product.description}">Descrição detalhada aqui.</p>
        </div>

        <div class="card p-4 border-0 shadow-sm bg-light">
          <form th:data-user-id="${#authentication.principal != 'anonymousUser' ? #authentication.principal.id : ''}">
            <input type="hidden" name="productId" th:value="${product.id}">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label small fw-bold">Quantidade</label>
                <input type="number" name="quantity" value="1" min="1" class="form-control form-control-lg text-center">
              </div>
              <div class="col-md-8 d-flex align-items-end">
                <button onclick="addToCart(this)" type="button" class="btn btn-primary btn-lg w-100 py-3 fw-bold">
                  <i class="fas fa-shopping-cart me-2"></i>ADICIONAR AO CARRINHO
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="container mt-5 pt-5 border-top">
    <div class="row">
      <div class="col-lg-8">
        <h3 class="fw-bold mb-4">Avaliações dos Clientes</h3>

        <div sec:authorize="isAuthenticated()" class="card border-0 shadow-sm mb-5 p-4 bg-light">
          <h5 class="fw-bold mb-3"><i class="fas fa-pen-fancy me-2"></i>Deixe sua opinião</h5>
          <form id="reviewForm" th:data-user-id="${#authentication.principal != 'anonymousUser' ? #authentication.principal.id : ''}">
            <input type="hidden" id="productId" name="productId" th:value="${product.id}">
            <div class="mb-3">
              <label class="form-label fw-bold">Nota (1 a 5)</label>
              <select id="rating" name="rating" class="form-select w-25" required>
                <option value="5">5 - Excelente</option>
                <option value="4">4 - Muito Bom</option>
                <option value="3">3 - Regular</option>
                <option value="2">2 - Ruim</option>
                <option value="1">1 - Muito Ruim</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Sua Review</label>
              <textarea id="reviewText" name="review" class="form-control" rows="3" placeholder="O que você achou deste produto?" required></textarea>
            </div>
            <button type="button" onclick="submitReview(this)" class="btn btn-primary px-4 fw-bold">Publicar Avaliação</button>
          </form>
        </div>

        <div th:if="${reviews.empty}" class="text-muted italic py-3">
          Este produto ainda não possui avaliações.
        </div>

        <div th:each="rev : ${reviews.content}" class="mb-4 pb-4 border-bottom">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="text-warning mb-2">
                <i th:each="i : ${#numbers.sequence(1, 5)}"
                   th:class="${i <= rev.rating} ? 'fas fa-star' : 'far fa-star'"></i>
              </div>
              <h6 class="fw-bold mb-1" th:text="${rev.user.name}">Nome do Usuário</h6>
              <p class="text-muted" th:text="${rev.review}">Texto da avaliação.</p>
            </div>

            <div th:if="${currentUserId == rev.user.id or #authorization.expression('hasRole(''ADMIN'')')}" class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-secondary" th:data-id="${rev.id}" th:data-rating="${rev.rating}" th:data-review="${rev.review}" title="Editar" onclick="openEditModal(this)">
                <i class="fas fa-edit"></i>
              </button>

              <button type="button" class="btn btn-sm btn-outline-danger" th:data-id="${rev.id}" onclick="deleteReview(this)">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card p-4 border-0 shadow-sm text-center">
          <h1 class="display-3 fw-bold text-primary" th:text="${product.rating}">4.5</h1>
          <div class="text-warning mb-2 fs-4">
            <i class="fas fa-star"></i> Média Geral
          </div>
          <p class="text-muted" th:text="${reviews.totalElements + ' avaliações'}"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editReviewModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Avaliação</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editReviewId">
        <div class="mb-3">
          <label class="form-label">Nota</label>
          <select id="editRating" class="form-select">
            <option value="5">5 - Excelente</option>
            <option value="4">4 - Muito Bom</option>
            <option value="3">3 - Regular</option>
            <option value="2">2 - Ruim</option>
            <option value="1">1 - Muito Ruim</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Review</label>
          <textarea id="editReviewText" class="form-control" rows="3"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="updateReview()">Salvar Alterações</button>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.x/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/javascript/script.js}"></script>
</body>
</html>
