<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Busca - Ecommerce</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="margin-top: 10vh;">
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container mb-5">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h2 class="fw-bold">Resultado da busca</h2>
            <p class="text-muted" th:if="${query != null && !query.isEmpty()}">
                Mostrando resultados para: <strong class="text-primary" th:text="${query}"></strong>
            </p>
        </div>
        <div class="col-auto">
            <span class="badge bg-dark px-3 py-2" th:text="${products.totalElements + ' produtos encontrados'}"></span>
        </div>
    </div>

    <div th:if="${products.empty}" class="text-center py-5">
        <i class="fas fa-search mb-3 text-muted" style="font-size: 3rem;"></i>
        <h3>Nenhum produto encontrado</h3>
        <p class="text-muted">Tente usar palavras-chave mais genéricas.</p>
        <a th:href="@{/}" class="btn btn-primary mt-3">Voltar para Home</a>
    </div>

    <div class="row g-4">
        <div class="col-sm-6 col-lg-4 col-xl-3" th:each="product : ${products.content}">
            <div th:replace="~{fragments :: product-card(product=${product})}"></div>
        </div>
    </div>

    <nav th:if="${products.totalPages > 1}" class="mt-5">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link" th:href="@{/produtos/search(q=${query}, page=${products.number - 1})}">Anterior</a>
            </li>
            <li class="page-item disabled"><span class="page-link" th:text="${products.number + 1}"></span></li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link" th:href="@{/produtos/search(q=${query}, page=${products.number + 1})}">Próximo</a>
            </li>
        </ul>
    </nav>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/javascript/script.js}"></script>
</body>
</html>
