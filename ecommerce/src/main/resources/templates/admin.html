<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin - Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background-color: rgb(250, 250, 250); display: flex; flex-direction: column; min-height: 100vh; margin: 0;">
    <nav th:replace="~{navbar :: navbar}"></nav>

    <!-- Sidebar -->
    <div th:replace="~{admin_sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <div style="flex-grow: 1; margin-left: 250px; padding-top: 80px;">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <!-- Success/Error Messages -->
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Dashboard Overview -->
                    <h1 class="mb-4">Visão Geral do Painel Administrativo</h1>

                    <!-- Statistics Cards -->
                    <div class="row mb-4">
                        <div class="col-md-3">
                            <div class="card text-white bg-primary">
                                <div class="card-body">
                                    <h5 class="card-title"><i class="fa-solid fa-users me-2"></i>Usuários</h5>
                                    <p class="card-text fs-4" th:text="${users.totalElements}">0</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-white bg-success">
                                <div class="card-body">
                                    <h5 class="card-title"><i class="fa-solid fa-box me-2"></i>Produtos</h5>
                                    <p class="card-text fs-4">0</p> <!-- TODO: Add product count -->
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-white bg-warning">
                                <div class="card-body">
                                    <h5 class="card-title"><i class="fa-solid fa-tags me-2"></i>Categorias</h5>
                                    <p class="card-text fs-4" th:text="${categories.totalElements}">0</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-white bg-info">
                                <div class="card-body">
                                    <h5 class="card-title"><i class="fa-solid fa-shopping-cart me-2"></i>Pedidos</h5>
                                    <p class="card-text fs-4">0</p> <!-- TODO: Add order count -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
<footer th:replace="~{footer :: footer}"></footer>
</html>
