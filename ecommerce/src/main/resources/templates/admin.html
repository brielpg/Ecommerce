<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin - Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav th:replace="~{navbar :: navbar}"></nav>

    <div class="container mt-5" style="padding-top: 80px;">
        <div class="row">
            <div class="col-md-12">
                <h1>Painel Administrativo</h1>

                <!-- Success/Error Messages -->
                <div th:if="${categorySuccess}" class="alert alert-success" role="alert">
                    <span th:text="${categorySuccess}"></span>
                </div>
                <div th:if="${categoryError}" class="alert alert-danger" role="alert">
                    <span th:text="${categoryError}"></span>
                </div>
                <div th:if="${productSuccess}" class="alert alert-success" role="alert">
                    <span th:text="${productSuccess}"></span>
                </div>
                <div th:if="${productError}" class="alert alert-danger" role="alert">
                    <span th:text="${productError}"></span>
                </div>

                <!-- Create Category Form -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Criar Nova Categoria</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/categories}" method="post" th:object="${categoryDto}">
                            <div class="mb-3">
                                <label for="categoryName" class="form-label">Nome da Categoria</label>
                                <input type="text" class="form-control" id="categoryName" th:field="*{name}" required>
                            </div>
                            <div class="mb-3">
                                <label for="categoryDescription" class="form-label">Descrição</label>
                                <textarea class="form-control" id="categoryDescription" th:field="*{description}" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Criar Categoria</button>
                        </form>
                    </div>
                </div>

                <!-- Create Product Form -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Criar Novo Produto</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/products}" method="post" th:object="${productDto}">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="productName" class="form-label">Nome do Produto</label>
                                        <input type="text" class="form-control" id="productName" th:field="*{name}" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="productPrice" class="form-label">Preço</label>
                                        <input type="number" step="0.01" class="form-control" id="productPrice" th:field="*{price}" required>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="productDescription" class="form-label">Descrição</label>
                                <textarea class="form-control" id="productDescription" th:field="*{description}" rows="3" required></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="productStock" class="form-label">Estoque</label>
                                        <input type="number" class="form-control" id="productStock" th:field="*{stock}" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="productCategories" class="form-label">Categorias (IDs separados por vírgula)</label>
                                        <input type="text" class="form-control" id="productCategories" placeholder="ex: uuid1,uuid2">
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">Criar Produto</button>
                        </form>
                    </div>
                </div>

                <!-- Users List -->
                <div class="card">
                    <div class="card-header">
                        <h5>Gerenciar Usuários</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nome</th>
                                        <th>Email</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users.content}">
                                        <td th:text="${user.id}"></td>
                                        <td th:text="${user.name}"></td>
                                        <td th:text="${user.email}"></td>
                                        <td>
                                            <a th:href="@{/api/users/{id}(id=${user.id})}" class="btn btn-sm btn-info" target="_blank">Ver API</a>
                                            <!-- Future: Add edit/delete buttons -->
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination -->
                        <nav aria-label="Users pagination" th:if="${totalPages > 1}">
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin(page=${currentPage - 1}, size=10)}" aria-label="Previous">
                                        <span aria-hidden="true">&laquo;</span>
                                    </a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                                    <a class="page-link" th:href="@{/admin(page=${i}, size=10)}" th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin(page=${currentPage + 1}, size=10)}" aria-label="Next">
                                        <span aria-hidden="true">&raquo;</span>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
<footer th:replace="~{footer :: footer}"></footer>
</html>
