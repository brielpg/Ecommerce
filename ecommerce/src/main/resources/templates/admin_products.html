<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin - Produtos | Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --sidebar-width: 260px; }
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }

        .main-content {
            margin-left: var(--sidebar-width);
            padding-top: 70px;
            min-height: 100vh;
            transition: all 0.3s;
        }

        .admin-card { border: none; border-radius: 12px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .table thead th { background-color: #f8f9fa; border-top: none; text-transform: uppercase; font-size: 0.75rem; color: #6c757d; padding: 15px; }

        /* Status Badges */
        .status-badge { padding: 0.4em 0.8em; border-radius: 50rem; font-size: 0.85rem; font-weight: 600; }
        .bg-light-success { background-color: #d1e7dd; color: #0f5132; }
        .bg-light-danger { background-color: #f8d7da; color: #842029; }

        .product-img-sm { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }

        @media (max-width: 992px) { .main-content { margin-left: 0; } }
    </style>
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: sidebar}"></div>

<main class="main-content">
    <div class="container-fluid p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark mb-1">Produtos</h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/admin" class="text-decoration-none">Dashboard</a></li>
                        <li class="breadcrumb-item active">Produtos</li>
                    </ol>
                </nav>
            </div>
            <button class="btn btn-primary px-4 shadow-sm fw-bold" data-bs-toggle="modal" data-bs-target="#createProductModal">
                <i class="fas fa-plus me-2"></i>Novo Produto
            </button>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm" role="alert">
            <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card admin-card mb-4">
            <div class="card-body p-3">
                <form method="get" th:action="@{/admin/products}" class="row g-2">
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-search"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" name="search" th:value="${param.search}" placeholder="Nome do produto...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" name="categoryId">
                            <option value="">Todas as Categorias</option>
                            <option th:each="cat : ${allCategories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${#strings.equals(param.categoryId, cat.id)}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-dark w-100">Filtrar</button>
                    </div>
                    <div class="col-md-2">
                        <a href="/admin/products" class="btn btn-outline-secondary w-100">Limpar</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card admin-card overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Produto</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products.content}">
                        <td class="ps-4">
                            <div class="d-flex align-items-center">
                                <div class="fw-bold text-dark" th:text="${product.name}">Nome do Produto</div>
                            </div>
                            <div class="text-muted small" th:text="${'ID: ' + #strings.abbreviate(product.id, 8)}">ID</div>
                        </td>
                        <td class="fw-bold text-dark">
                            R$ <span th:text="${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')}">0,00</span>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${product.stock + ' un'}">0</span>
                        </td>
                        <td>
                            <span th:if="${product.active}" class="status-badge bg-light-success">Ativo</span>
                            <span th:unless="${product.active}" class="status-badge bg-light-danger">Inativo</span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="btn-group shadow-sm">
                                <button class="btn btn-white btn-sm border" title="Editar"
                                        onclick="editProduct(this)"
                                        th:data-id="${product.id}"
                                        th:data-name="${product.name}"
                                        th:data-price="${product.price}"
                                        th:data-description="${product.description}"
                                        th:data-stock="${product.stock}">
                                    <i class="fas fa-edit text-primary"></i>
                                </button>
                                <button th:if="${product.active}" class="btn btn-white btn-sm border text-danger"
                                        onclick="deleteProduct(this)" th:data-id="${product.id}" th:data-name="${product.name}">
                                    <i class="fas fa-trash"></i>
                                </button>
                                <button th:unless="${product.active}" class="btn btn-white btn-sm border text-success"
                                        onclick="restoreProduct(this)" th:data-id="${product.id}" th:data-name="${product.name}">
                                    <i class="fas fa-undo"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="card-footer bg-white py-3 border-0">
                <nav th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/products(page=${currentPage - 1}, search=${param.search}, categoryId=${param.categoryId})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/admin/products(page=${i}, search=${param.search}, categoryId=${param.categoryId})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/products(page=${currentPage + 1}, search=${param.search}, categoryId=${param.categoryId})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="createProductModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-dark text-white border-0">
                <h5 class="modal-title fw-bold" id="createProductModalLabel">Novo Produto</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="productForm" method="post" th:action="@{/admin/products}" th:object="${productDto}" enctype="multipart/form-data">
                <div class="modal-body p-4">
                    <input type="hidden" id="productId" name="id">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label fw-bold">Nome do Produto</label>
                            <input type="text" class="form-control" id="productName" name="name" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Preço (R$)</label>
                            <input type="number" step="0.01" class="form-control" id="productPrice" name="price" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Descrição</label>
                            <textarea class="form-control" id="productDescription" name="description" rows="3" required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Estoque Inicial</label>
                            <input type="number" class="form-control" id="productStock" name="stock" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Categorias</label>
                            <select multiple class="form-select" id="productCategories" name="categories" style="height: 100px;">
                                <option th:each="category : ${allCategories}" th:value="${category.id}" th:text="${category.name}"></option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Imagem do Produto</label>
                            <input type="file" class="form-control" id="productImage" name="image" accept="image/*">
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-5 fw-bold" id="saveProductBtn">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function restoreProduct(button) {
        const id = button.getAttribute('data-id');
        const name = button.getAttribute('data-name');

        if (confirm(`Tem certeza que deseja restaurar o produto "${name}"?`)) {
                fetch(`/api/products/${id}/restore`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        alert('Erro ao restaurar produto');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Erro ao restaurar produto');
                });
        }
    }

    function editProduct(button) {
        const id = button.getAttribute('data-id');
        const name = button.getAttribute('data-name');
        const price = button.getAttribute('data-price');
        const description = button.getAttribute('data-description');
        const stock = button.getAttribute('data-stock');
        const categoriesString = button.getAttribute('data-categories');
        const categories = categoriesString ? categoriesString.split(',') : [];

        // 1. Armazena os dados originais no formulário
        const form = document.getElementById('productForm');
        form.dataset.originalId = id;
        form.dataset.originalName = name;
        // O preço e estoque precisam ser strings para comparação direta com o valor do input
        form.dataset.originalPrice = parseFloat(price).toFixed(2);
        form.dataset.originalDescription = description;
        form.dataset.originalStock = stock;
        form.dataset.originalCategories = categories.join(',');

        // 2. Preenche os campos do formulário (o restante do código é o mesmo)
        document.getElementById('productId').value = id;
        document.getElementById('productName').value = name;
        document.getElementById('productPrice').value = form.dataset.originalPrice;
        document.getElementById('productDescription').value = description;
        document.getElementById('productStock').value = stock;

        // 3. Define as categorias selecionadas
        const categorySelect = document.getElementById('productCategories');
        for (let option of categorySelect.options) {
            option.selected = categories.includes(option.value);
        }

        // 4. Configura o formulário para MODO EDIÇÃO
        form.dataset.mode = 'edit';
        document.getElementById('saveProductBtn').innerHTML = 'Atualizar';
        document.getElementById('createProductModalLabel').innerHTML = 'Editar Produto';
        document.getElementById('productImage').required = false;

        const modal = new bootstrap.Modal(document.getElementById('createProductModal'));
        modal.show();
    }

    function deleteProduct(button) {
        const id = button.getAttribute('data-id');
        const name = button.getAttribute('data-name');

        if (confirm(`Tem certeza que deseja excluir o produto "${name}"?`)) {
            fetch(`/api/products/${id}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert('Erro ao excluir produto');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Erro ao excluir produto');
            });
        }
    }

    document.getElementById('productForm').addEventListener('submit', function (event) {
        const form = event.target;
        const productId = document.getElementById('productId').value;
        const mode = form.dataset.mode;

        if (mode === 'edit' && productId) {
            event.preventDefault();

            // 1. Coleta os valores atuais e originais
            const currentPrice = document.getElementById('productPrice').value.replace(',', '.');
            const currentStock = document.getElementById('productStock').value;
            const currentName = document.getElementById('productName').value;
            const currentDescription = document.getElementById('productDescription').value;
            const originalName = form.dataset.originalName;
            const originalDescription = form.dataset.originalDescription;
            const originalPrice = form.dataset.originalPrice;
            const originalStock = form.dataset.originalStock;

            // 2. Constrói o DTO de atualização parcial
            const productData = {
                id: productId
            };

            // Compara e adiciona ao JSON SOMENTE se for diferente
            if (currentName !== originalName) { productData.name = currentName; }
            if (currentDescription !== originalDescription) { productData.description = currentDescription; }
            if (currentPrice !== originalPrice) {  productData.price = parseFloat(currentPrice); }
            if (currentStock !== originalStock) { productData.stock = parseInt(currentStock); }

            const keysToUpdate = Object.keys(productData).filter(key => key !== 'id');

            if (keysToUpdate.length === 0) {
                alert('Nenhuma alteração detectada para o produto.');
                // Fecha o modal se nada foi alterado
                bootstrap.Modal.getInstance(document.getElementById('createProductModal')).hide();
                return;
            }

            // Se houver campos alterados, realiza o PUT
            fetch('/api/products', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(productData)
            })
            .then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    return response.json().then(err => {
                        alert(`Erro ao atualizar produto: ${err.message || response.statusText}`);
                    }).catch(() => {
                        alert(`Erro ao atualizar produto: ${response.statusText}`);
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Erro de rede ao atualizar produto.');
            });
        }
    });

    // Reset modal when closed
    document.getElementById('createProductModal').addEventListener('hidden.bs.modal', function () {
        document.getElementById('productId').value = '';
        document.getElementById('productName').value = '';
        document.getElementById('productPrice').value = '';
        document.getElementById('productDescription').value = '';
        document.getElementById('productStock').value = '';
        document.getElementById('productImage').value = '';

        // Limpa as seleções de categoria
        const categorySelect = document.getElementById('productCategories');
        for (let option of categorySelect.options) {
            option.selected = false;
        }

        // Restaura o texto e título para o modo CRIAÇÃO
        document.getElementById('saveProductBtn').innerHTML = 'Salvar';
        document.getElementById('createProductModalLabel').innerHTML = 'Criar Novo Produto';
    });

</script>
</body>
</html>
