<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Perfil - Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background-color: rgb(250, 250, 250); display: flex; flex-direction: column; min-height: 100vh; margin: 0;">
    <nav th:replace="~{navbar :: navbar}"></nav>

    <div style="flex-grow: 1;">
    <div class="container mt-5" style="padding-top: 80px;">
        <div class="row">
            <div class="col-md-12">
                <h1>Perfil do Usuário</h1>

                <!-- Exibir mensagens de sucesso ou erro -->
                <div th:if="${success}" class="alert alert-success" role="alert">
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}"></span>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Informações Pessoais</h5>
                        <p class="card-text"><strong>Nome:</strong> <span th:text="${user.name}">Nome do Usuário</span></p>
                        <p class="card-text"><strong>Email:</strong> <span th:text="${user.email}">user@email.com</span></p>
                        <p class="card-text"><strong>Telefone:</strong> <span th:text="${user.phone}">Telefone</span></p>
                        <p class="card-text"><strong>Data de Nascimento:</strong> <span th:text="${#temporals.format(user.birthDate, 'dd/MM/yyyy')}">00/00/0000</span></p>
                        <button type="button" class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#editProfileModal">Editar Perfil</button>
                        <button type="button" class="btn btn-danger mt-3 ms-2" data-bs-toggle="modal" data-bs-target="#deleteAccountModal">Deletar Conta</button>
                    </div>
                </div>

                <!-- Modal para Editar Perfil -->
                <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="editProfileModalLabel">Editar Perfil</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <form th:action="@{/profile/update}" method="post">
                                <div class="modal-body">
                                    <input type="hidden" th:name="id" th:value="${user.id}">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Nome</label>
                                        <input type="text" class="form-control" id="name" th:name="name" th:value="${user.name}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="email" th:name="email" th:value="${user.email}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="phone" class="form-label">Telefone</label>
                                        <input type="text" class="form-control" id="phone" th:name="phone" th:value="${user.phone}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="birthDate" class="form-label">Data de Nascimento</label>
                                        <input type="date" class="form-control" id="birthDate" th:name="birthDate" th:value="${#temporals.format(user.birthDate, 'yyyy-MM-dd')}" required>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Modal para Deletar Conta -->
                <div class="modal fade" id="deleteAccountModal" tabindex="-1" aria-labelledby="deleteAccountModalLabel" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="deleteAccountModalLabel">Deletar Conta</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <p>Tem certeza de que deseja deletar sua conta? Esta ação não pode ser desfeita.</p>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <form th:action="@{/profile/delete}" method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-danger">Deletar Conta</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
<footer th:replace="~{footer :: footer}"></footer>
</html>
