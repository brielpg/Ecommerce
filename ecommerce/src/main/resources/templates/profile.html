<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Perfil - Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav th:replace="~{navbar :: navbar}"></nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <h1>Perfil do Usuário</h1>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Informações Pessoais</h5>
                        <p class="card-text"><strong>Nome:</strong> <span th:text="${user.name}">Nome do Usuário</span></p>
                        <p class="card-text"><strong>Email:</strong> <span th:text="${user.email}">email@example.com</span></p>
                        <p class="card-text"><strong>Telefone:</strong> <span th:text="${user.phone}">Telefone</span></p>
                        <p class="card-text"><strong>Data de Nascimento:</strong> <span th:text="${#temporals.format(user.birthDate, 'dd/MM/yyyy')}">01/01/2000</span></p>
                        <p class="card-text"><strong>Função:</strong> <span th:text="${user.role}">CUSTOMER</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
<footer th:replace="~{footer :: footer}"></footer>
</html>
