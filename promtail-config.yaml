server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker_logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            logger: logger
            traceId: traceId
            userId: userId
            eventType: eventType
            exception_class: error_class
            stack_trace: stack_trace 
      - labels:
          level:
          traceId:
          userId:
      - timestamp:
          source: timestamp
          format: RFC3339
      - output:
          source: message